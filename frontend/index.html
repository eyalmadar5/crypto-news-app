<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח מטבעות | חדשות ומחירים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D1117;
    --panel: #12161D;
    --panel-hi: #171C25;
    --line: #232933;
    --text: #E6E9EF;
    --text-dim: #838C9B;
    --amber: #E8A33D;
    --amber-dim: #6B5228;
    --up: #4FBF7A;
    --down: #E2596B;
    --official: #6E9FE8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.08), transparent),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(110,159,232,0.06), transparent);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header.top .title-block .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--amber);
    text-transform: uppercase;
  }
  header.top h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 4px 0 0;
    letter-spacing: -0.01em;
  }
  #refreshBtn {
    background: var(--amber);
    color: #1a1206;
    border: none;
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  #refreshBtn:hover { filter: brightness(1.08); }
  #refreshBtn:active { transform: scale(0.97); }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }
  #lastUpdated {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    text-align: left;
  }

  /* ticker strip */
  .ticker {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 30px;
  }
  @media (max-width: 760px) {
    .ticker { grid-template-columns: repeat(2, 1fr); }
  }
  .coin-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .coin-card:hover { border-color: var(--amber-dim); }
  .coin-card.active { border-color: var(--amber); background: var(--panel-hi); }
  .coin-card .sym {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .coin-card .name { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .coin-card .price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    margin-top: 10px;
    direction: ltr;
    text-align: right;
  }
  .coin-card .chg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    margin-top: 4px;
    direction: ltr;
    text-align: right;
  }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .coin-card .no-data { color: var(--text-dim); font-size: 12px; margin-top: 10px; }

  /* filters */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .filter-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .filter-chip.active {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(232,163,61,0.08);
  }

  /* news list */
  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin: 26px 0 12px;
  }
  .article {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: border-color 0.15s ease;
  }
  .article:hover { border-color: #333b47; }
  .article a.title {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15.5px;
    line-height: 1.4;
    display: block;
  }
  .article a.title:hover { color: var(--amber); }
  .article .summary {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 6px;
    line-height: 1.5;
  }
  .meta-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .tag.official { border-color: var(--official); color: var(--official); }
  .tag.coin { border-color: var(--amber-dim); color: var(--amber); }
  .tag.time { border: none; padding: 0; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty-state .big { font-size: 30px; margin-bottom: 8px; }

  footer.note {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <div class="eyebrow">Local Dashboard · MVP</div>
      <h1>מעקב מטבעות דיגיטליים</h1>
    </div>
    <div>
      <button id="refreshBtn" onclick="refreshAll()">רענון נתונים</button>
      <div id="lastUpdated">טרם רוענן</div>
    </div>
  </header>

  <div class="ticker" id="tickerStrip"></div>

  <div class="filters" id="filters"></div>

  <div class="section-label">כתבות</div>
  <div id="newsList"></div>

  <footer class="note">
    מקורות: אתרי חדשות קריפטו בינלאומיים (CoinDesk, Cointelegraph, Decrypt, CryptoSlate, The Daily Hodl) + בלוגים רשמיים של הפרויקטים, כשקיימים.
    מחירים: CoinGecko. הכל רץ מקומית — לחצו "רענון נתונים" כדי למשוך עדכונים חדשים.
  </footer>

</div>

<script>
const API = "";
let COINS = {};
let activeFilter = null; // null = הכל

async function loadCoins() {
  const res = await fetch(API + "/api/coins");
  COINS = await res.json();
  renderFilters();
}

function renderFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = "";
  const allChip = document.createElement("button");
  allChip.className = "filter-chip" + (activeFilter === null ? " active" : "");
  allChip.textContent = "הכל";
  allChip.onclick = () => { activeFilter = null; renderFilters(); loadNews(); highlightTicker(); };
  el.appendChild(allChip);

  Object.keys(COINS).forEach(sym => {
    const chip = document.createElement("button");
    chip.className = "filter-chip" + (activeFilter === sym ? " active" : "");
    chip.textContent = sym;
    chip.onclick = () => { activeFilter = sym; renderFilters(); loadNews(); highlightTicker(); };
    el.appendChild(chip);
  });
}

function highlightTicker() {
  document.querySelectorAll(".coin-card").forEach(c => {
    c.classList.toggle("active", c.dataset.sym === activeFilter);
  });
}

async function loadPrices() {
  const res = await fetch(API + "/api/prices");
  const prices = await res.json();
  const bySym = {};
  prices.forEach(p => bySym[p.coin] = p);

  const strip = document.getElementById("tickerStrip");
  strip.innerHTML = "";
  Object.entries(COINS).forEach(([sym, name]) => {
    const p = bySym[sym];
    const card = document.createElement("div");
    card.className = "coin-card" + (activeFilter === sym ? " active" : "");
    card.dataset.sym = sym;
    card.onclick = () => { activeFilter = (activeFilter === sym ? null : sym); renderFilters(); loadNews(); highlightTicker(); };

    if (p && p.usd !== null && p.usd !== undefined) {
      const chg = p.usd_24h_change;
      const chgClass = chg >= 0 ? "up" : "down";
      const chgSign = chg >= 0 ? "+" : "";
      card.innerHTML = `
        <div class="sym">${sym}</div>
        <div class="name">${name}</div>
        <div class="price">$${formatPrice(p.usd)}</div>
        <div class="chg ${chgClass}">${chgSign}${chg !== null && chg !== undefined ? chg.toFixed(2) : "0.00"}%</div>
      `;
    } else {
      card.innerHTML = `
        <div class="sym">${sym}</div>
        <div class="name">${name}</div>
        <div class="no-data">אין נתון עדיין — לחץ רענון</div>
      `;
    }
    strip.appendChild(card);
  });
}

function formatPrice(v) {
  if (v >= 1) return v.toFixed(3);
  return v.toFixed(5);
}

function timeAgo(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
  if (diffMin < 1) return "עכשיו";
  if (diffMin < 60) return `לפני ${diffMin} דק'`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `לפני ${diffH} שעות`;
  return `לפני ${Math.floor(diffH / 24)} ימים`;
}

async function loadNews() {
  const url = API + "/api/news" + (activeFilter ? `?coin=${activeFilter}` : "");
  const res = await fetch(url);
  const articles = await res.json();
  const list = document.getElementById("newsList");

  if (articles.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="big">🗞️</div>עדיין אין כתבות שמורות${activeFilter ? " עבור " + activeFilter : ""}.<br>לחץ "רענון נתונים" כדי למשוך כתבות עכשיו.</div>`;
    return;
  }

  list.innerHTML = "";
  articles.forEach(a => {
    const div = document.createElement("div");
    div.className = "article";
    const coinsTags = a.coins.split(",").map(c => `<span class="tag coin">${c}</span>`).join("");
    const kindTag = a.kind === "official" ? `<span class="tag official">מקור רשמי</span>` : `<span class="tag">${a.source}</span>`;
    div.innerHTML = `
      <a class="title" href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
      ${a.summary ? `<div class="summary">${stripHtml(a.summary).slice(0, 220)}</div>` : ""}
      <div class="meta-row">
        ${kindTag}
        ${coinsTags}
        <span class="tag time">${timeAgo(a.fetched_at)}</span>
      </div>
    `;
    list.appendChild(div);
  });
}

function stripHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || "";
}

async function refreshAll() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  btn.textContent = "מרענן...";
  try {
    await fetch(API + "/api/refresh", { method: "POST" });
    await loadPrices();
    await loadNews();
    document.getElementById("lastUpdated").textContent = "עודכן: " + new Date().toLocaleTimeString("he-IL");
  } catch (e) {
    document.getElementById("lastUpdated").textContent = "שגיאה ברענון — בדוק חיבור לאינטרנט";
  } finally {
    btn.disabled = false;
    btn.textContent = "רענון נתונים";
  }
}

(async function init() {
  await loadCoins();
  await loadPrices();
  await loadNews();
})();
</script>
</body>
</html>
